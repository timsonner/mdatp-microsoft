# Partial override for fleet builds. Used as:
#   makepkg --config ./makepkg.local.conf ...
# We source pacman's stock config, then pin DEST dirs to this repo.

if [[ -r /etc/makepkg.conf ]]; then
  source /etc/makepkg.conf
elif [[ -r /usr/share/pacman/defaults/makepkg.conf ]]; then
  source /usr/share/pacman/defaults/makepkg.conf
fi

_here="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" && pwd)"
SRCDEST="${_here}/cache"
PKGDEST="${_here}/out"
LOGDEST="${_here}/logs"
BUILDDIR="${_here}/build"
